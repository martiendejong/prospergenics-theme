<?xml version="1.0" encoding="UTF-8"?>
<!--
  Architecture visual: AI agent denial as security boundary
  Task 4298 | Run: run-31b36bb66946
  Flow: Agent Action -> External Denial -> DenialSecurityEvent -> Policy Decision -> Stop | Approved Alternative
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480"
     font-family="system-ui, -apple-system, sans-serif" role="img"
     aria-label="Architectuurschema: AI-agent weigering als veiligheidsgrens">

  <title>AI-agent weigering als veiligheidsgrens - architectuurschema</title>
  <desc>Stroomdiagram: agentactie leidt tot externe weigering, die een beveiligingsevenement genereert, waarna een beleidsbeslissing bepaalt of de agent stopt of een goedgekeurde alternatieve route neemt.</desc>

  <!-- Background -->
  <rect width="760" height="480" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">
    Weigering als veiligheidsgrens
  </text>
  <text x="380" y="50" text-anchor="middle" font-size="11" fill="#64748b">
    Django agent risk model
  </text>

  <!-- ---- BOXES ---- -->

  <!-- Box 1: Agent Action -->
  <rect x="30" y="80" width="140" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">AI-agent</text>
  <text x="100" y="122" text-anchor="middle" font-size="11" fill="#1e40af">voert actie uit</text>

  <!-- Box 2: External Service -->
  <rect x="250" y="80" width="140" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Externe dienst</text>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="#334155">API / website</text>

  <!-- Arrow 1: Agent -> External -->
  <line x1="170" y1="110" x2="248" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="209" y="104" text-anchor="middle" font-size="10" fill="#64748b">verzoek</text>

  <!-- Box 3: Denial response -->
  <rect x="250" y="200" width="140" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="320" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Weigering</text>
  <text x="320" y="240" text-anchor="middle" font-size="11" fill="#991b1b">401 / 403 / 429 / CAPTCHA</text>

  <!-- Arrow: External -> Denial (down) -->
  <line x1="320" y1="140" x2="320" y2="198" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <text x="334" y="172" font-size="10" fill="#ef4444">weigert</text>

  <!-- Box 4: SecurityEvent -->
  <rect x="470" y="200" width="160" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">ExternalDenial</text>
  <text x="550" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">SecurityEvent</text>
  <text x="550" y="251" text-anchor="middle" font-size="10" fill="#92400e">onveranderlijk + tijdstempel</text>

  <!-- Arrow: Denial -> SecurityEvent -->
  <line x1="390" y1="230" x2="468" y2="230" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="429" y="223" text-anchor="middle" font-size="10" fill="#92400e">genereert</text>

  <!-- Box 5: Chain Analysis -->
  <rect x="470" y="310" width="160" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="550" y="334" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Keten-analyse</text>
  <text x="550" y="350" text-anchor="middle" font-size="10" fill="#78350f">patroondetectie over</text>
  <text x="550" y="362" text-anchor="middle" font-size="10" fill="#78350f">de volledige actieketen</text>

  <!-- Arrow: SecurityEvent -> Chain Analysis -->
  <line x1="550" y1="260" x2="550" y2="308" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Box 6: Policy Decision -->
  <rect x="250" y="310" width="160" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="330" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Beleidsbeslissing</text>
  <text x="330" y="350" text-anchor="middle" font-size="11" fill="#3730a3">menselijke autoriteit</text>
  <text x="330" y="365" text-anchor="middle" font-size="10" fill="#6366f1">doel + scope + credential</text>

  <!-- Arrow: Chain Analysis -> Policy Decision -->
  <line x1="470" y1="340" x2="412" y2="340" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>

  <!-- Agent containment (between denial and policy) -->
  <rect x="80" y="200" width="140" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="150" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Agent: bevroren</text>
  <text x="150" y="236" text-anchor="middle" font-size="10" fill="#64748b">geen externe acties</text>
  <text x="150" y="248" text-anchor="middle" font-size="10" fill="#64748b">totdat besluit is genomen</text>

  <!-- Arrow: Denial -> Frozen agent -->
  <path d="M 250 230 L 222 225" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)" fill="none"/>

  <!-- Box 7a: STOP -->
  <rect x="80" y="380" width="140" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="150" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">STOP</text>
  <text x="150" y="422" text-anchor="middle" font-size="11" fill="#b91c1c">buiten goedgekeurde scope</text>
  <text x="150" y="435" text-anchor="middle" font-size="10" fill="#ef4444">opgeslagen in Evidence Room</text>

  <!-- Box 7b: Approved alternative -->
  <rect x="420" y="380" width="160" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Goedgekeurde</text>
  <text x="500" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">alternatieve route</text>
  <text x="500" y="436" text-anchor="middle" font-size="10" fill="#16a34a">nieuwe lease + scope</text>

  <!-- Arrows from Policy Decision to outcomes -->
  <!-- Left arrow to STOP -->
  <path d="M 290 370 L 200 380" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)" fill="none"/>
  <text x="225" y="368" font-size="10" fill="#ef4444">weiger</text>

  <!-- Right arrow to Approved -->
  <path d="M 380 370 L 460 382" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)" fill="none"/>
  <text x="410" y="368" font-size="10" fill="#16a34a">keur goed</text>

  <!-- Evidence Room label (bottom right) -->
  <rect x="600" y="380" width="140" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="404" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Evidence Room</text>
  <text x="670" y="419" text-anchor="middle" font-size="10" fill="#64748b">volledige actieketen</text>
  <text x="670" y="432" text-anchor="middle" font-size="10" fill="#64748b">onveranderlijk opgeslagen</text>

  <!-- Arrow: Approved -> Evidence Room -->
  <line x1="580" y1="410" x2="598" y2="410" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow-light)"/>

  <!-- Legend -->
  <rect x="30" y="420" width="12" height="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="48" y="431" font-size="10" fill="#475569">Risico / blokkade</text>
  <rect x="30" y="438" width="12" height="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="48" y="449" font-size="10" fill="#475569">Goedgekeurd pad</text>
  <rect x="130" y="420" width="12" height="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="148" y="431" font-size="10" fill="#475569">Beveiligingsevenement</text>
  <rect x="130" y="438" width="12" height="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="148" y="449" font-size="10" fill="#475569">Menselijke beslissing (vereist)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#cbd5e1"/>
    </marker>
  </defs>

</svg>
