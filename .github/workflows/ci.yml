name: CI

# Lint + tests on every pull request and on pushes to the two long-lived branches.
# The test files are standalone PHP scripts (no WordPress install needed): each exits non-zero
# on a failed assertion. The wordpress-roles job checks permissions against a real WordPress.
on:
  pull_request:
  push:
    branches: [master, design/new-hero-2026-10]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP version
        run: php -v

      - name: Lint every PHP file
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || { echo "::error file=$f::PHP syntax error"; fail=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $fail

      - name: Run tests
        run: |
          fail=0
          for t in tests/*.php; do
            echo "::group::$t"
            php "$t" || { echo "::error file=$t::test failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      - name: Generated theme matches its design source
        if: hashFiles('design/new-hero-2026-10/build-wp-theme.py') != ''
        run: |
          python3 design/new-hero-2026-10/site_chrome.py
          python3 design/new-hero-2026-10/people/build-profiles.py
          python3 design/new-hero-2026-10/build-wp-theme.py
          # build-wp-theme.py rewrites wp-theme/prospergenics-2026/ from design/new-hero-2026-10/;
          # any difference means someone edited a generated file or forgot to rebuild.
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run build-profiles.py and build-wp-theme.py and commit the result."
            git diff --stat
            exit 1
          fi

  # The tests above stub WordPress, so they cannot see real roles, capabilities or REST permission
  # callbacks (audit ARC-18). This job boots WordPress 6.8 on SQLite with the built theme, seeds one
  # user per role and runs the role/permission matrix in tests/e2e/role-matrix.js; any unexpected
  # allow fails the job. Locally: bash tests/e2e/run.sh (see tests/e2e/README.md).
  wordpress-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache the pinned WordPress, SQLite plugin and WP-CLI downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pg-e2e-cache
          key: pg-e2e-${{ hashFiles('tests/e2e/run.sh') }}

      - name: Boot WordPress, seed roles, run the role matrix
        env:
          E2E_DIR: ${{ runner.temp }}/pg-e2e
          E2E_CACHE: ${{ runner.temp }}/pg-e2e-cache
          E2E_PORT: '8096'
        run: bash tests/e2e/run.sh

      - name: Keep the server and debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-roles-logs
          path: |
            ${{ runner.temp }}/pg-e2e/server.log
            ${{ runner.temp }}/pg-e2e/debug.log
            ${{ runner.temp }}/pg-e2e/fixtures.json
          if-no-files-found: ignore
