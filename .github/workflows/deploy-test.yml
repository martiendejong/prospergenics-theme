name: Deploy to test.prospergenics.com

# Every push to the design branch (including a merged pull request) is tested and then
# uploaded to the Vimexx hosting behind test.prospergenics.com with the same script Martien
# runs by hand: design/new-hero-2026-10/deploy-wp-theme-vimexx.py.
#
# Setup (once, by a repository admin): Settings -> Secrets and variables -> Actions ->
# add TEST_FTP_USERNAME and TEST_FTP_PASSWORD (the FTPS login for web0168.zxcs.nl, the same
# credential as vault project 6 / credential 266). Until both exist this workflow runs the
# tests and skips the upload with a notice, so it never fails just for missing secrets.
#
# The upload (audit ARC-17) first downloads the theme that is live now and keeps it as the
# "theme-backup-<sha>" artifact of the run (30 days). Restore one with
#   python3 design/new-hero-2026-10/deploy-wp-theme-vimexx.py --no-build --theme-only --theme-dir <unzipped>/<time>/prospergenics-2026
# It uploads every file under a temporary name and renames it into place, functions.php last,
# then deletes the files the previous deploy's manifest listed that are no longer in the build.
# "Run workflow" with dry_run logs that plan without changing anything.
on:
  push:
    branches: [design/new-hero-2026-10]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Connect and log what would be uploaded, backed up and deleted; change nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Run tests before deploying
        run: |
          for t in tests/*.php; do php "$t" > /dev/null || { echo "::error file=$t::test failed, not deploying"; exit 1; }; done
          python3 tests/test-deploy-script.py > /dev/null || { echo "::error::deploy script tests failed, not deploying"; exit 1; }

      - name: Check deploy credentials
        id: creds
        env:
          PG_FTP_USER: ${{ secrets.TEST_FTP_USERNAME }}
          PG_FTP_PASSWORD: ${{ secrets.TEST_FTP_PASSWORD }}
        run: |
          if [ -n "$PG_FTP_USER" ] && [ -n "$PG_FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TEST_FTP_USERNAME / TEST_FTP_PASSWORD are not set, so nothing was uploaded. See the comment at the top of this workflow."
          fi

      - name: Build and upload
        if: steps.creds.outputs.ready == 'true'
        env:
          PG_FTP_USER: ${{ secrets.TEST_FTP_USERNAME }}
          PG_FTP_PASSWORD: ${{ secrets.TEST_FTP_PASSWORD }}
          PG_DEPLOY_BACKUP_DIR: ${{ runner.temp }}/theme-backup
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 design/new-hero-2026-10/deploy-wp-theme-vimexx.py $DRY_RUN

      - name: Keep the backup of the previous theme
        if: always() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: theme-backup-${{ github.sha }}
          path: ${{ runner.temp }}/theme-backup
          retention-days: 30
          if-no-files-found: ignore

      # Static pages, the platform routes (/courses/, /articles/, /profile/, the REST API), the old
      # /members/ redirect, the value test on the homepage and the shared header on every page.
      - name: Smoke-check the test site
        if: steps.creds.outputs.ready == 'true'
        run: bash tests/smoke/smoke-check.sh https://test.prospergenics.com
