name: Uptime test.prospergenics.com and prospergenics.com

# Every 30 minutes, for test.prospergenics.com and (since card #6473 was reopened for launch)
# prospergenics.com: /, /courses/, /articles/ and /wp-login.php must answer 200 or 302 without a
# PHP fatal error (tests/smoke/uptime-check.sh). A failure opens (or comments on) the GitHub issue
# "Uptime check failing" (test) or "Uptime check failing: prospergenics.com" (production), label
# "alert", which notifies every repository watcher and the logins in the repository variable
# ALERT_ASSIGNEES; the next passing run closes it (tests/smoke/alert-issue.sh, no extra secrets).
# GitHub also emails the failed run itself. See docs/OPERATIONS.md, "Where alerts go".
#
# Production is checked unless the repository variable UPTIME_PRODUCTION is "off"; the variable
# PRODUCTION_URL changes its address (default https://prospergenics.com).
#
# GitHub only runs scheduled workflows from the repository's DEFAULT branch, so this file has to
# be merged there before the schedule starts. "Run workflow" (workflow_dispatch) works from any
# branch for a manual check; give it a base_url that fails (for example
# https://test.prospergenics.com/no-such-site) to test the alert (only the test row runs then), then
# run it again normally.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Check only this site, under the test alert (change it to a failing URL to test the alert)
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        site: [test, production]
    steps:
      - name: Which site
        id: site
        env:
          SITE: ${{ matrix.site }}
          BASE_URL: ${{ inputs.base_url }}
          UPTIME_PRODUCTION: ${{ vars.UPTIME_PRODUCTION }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ "$SITE" = "test" ]; then
            echo "url=${BASE_URL:-https://test.prospergenics.com}" >> "$GITHUB_OUTPUT"
            echo "title=Uptime check failing" >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_URL" ] || [ "$UPTIME_PRODUCTION" = "off" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Production is not checked in this run (a manual base_url, or UPTIME_PRODUCTION=off)."
          else
            echo "url=${PRODUCTION_URL:-https://prospergenics.com}" >> "$GITHUB_OUTPUT"
            echo "title=Uptime check failing: prospergenics.com" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.site.outputs.skip != 'true'
        with:
          sparse-checkout: tests/smoke

      - name: Check the key pages
        if: steps.site.outputs.skip != 'true'
        shell: bash
        env:
          BASE_URL: ${{ steps.site.outputs.url }}
        run: bash tests/smoke/uptime-check.sh "$BASE_URL" | tee "$RUNNER_TEMP/uptime.txt"

      - name: Open or update the alert issue
        if: failure() && steps.site.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_ASSIGNEES: ${{ vars.ALERT_ASSIGNEES }}
          TITLE: ${{ steps.site.outputs.title }}
        run: bash tests/smoke/alert-issue.sh open "$TITLE" "$RUNNER_TEMP/uptime.txt"

      - name: Close the alert issue
        if: success() && steps.site.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ steps.site.outputs.title }}
        run: bash tests/smoke/alert-issue.sh close "$TITLE"
